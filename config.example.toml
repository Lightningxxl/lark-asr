# Copy this file to config.toml on host and edit paths.

[paths]
state_dir = "./data"
work_dir = "./work"
knowledgebase_dir = "/path/to/projects/knowledgebase"

[lark]
cli = "/path/to/.local/bin/lark-cli"
profile = ""
event_as = "bot"
api_as = "user"
event_filter = "im\\.message|vc\\.|calendar\\."
event_types = ""
no_proxy = true

[pipeline]
transcript_first = true
local_asr_fallback = true
resolve_retries = ["1m", "5m", "15m", "30m"]
minimum_transcript_chars = 80
auto_kb_write = false

[asr]
# Command runs only when Feishu has media but no transcript.
# The command should write a Markdown transcript under {job_dir}; the worker will
# pick the newest *.md by default.
enabled = false
command = """
/path/to/models/run_whisper_fallback.sh \
  --input {media_path} \
  --output-dir {job_dir}/local_asr \
  --minute-token {minute_token}
"""
output_glob = "local_asr/**/*.md"

[codex]
enabled = false
cmd = "/path/to/.local/bin/codex"
model = ""
reasoning_effort = "high"
extra_args = ""
prompt_template = """
你在 knowledgebase 仓库中工作。
请先读取仓库规则、AGENTS.md 和相关项目上下文。

会议转写稿路径:
{transcript_path}

会议元数据:
- minute_token: {minute_token}
- meeting_id: {meeting_id}
- calendar_event_id: {calendar_event_id}
- project_hint: {project_hint}

请根据知识库内容做热词修复，再按知识库规则把会议材料归档。
不要硬编码规则；遵循仓库里的 AGENTS.md。
"""

[[project]]
id = "demo-project"
path = "projects/active/Demo Demo AliasAIDemo Project"
aliases = ["Demo Project", "Demo Alias", "Demo Alias", "Demo Alias", "Demo Contact", "Demo Alias", "Demo OS"]

