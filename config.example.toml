# Copy this file to config.toml on host and edit paths.

[paths]
state_dir = "./data"
work_dir = "./work"
knowledgebase_dir = "/path/to/projects/knowledgebase"

[lark]
# Use the real host lark-cli binary with an explicit config dir. This avoids
# depending on the older wrapper token-state file.
cli = "/path/to/.local/share/mise/installs/node/22.22.2/bin/lark-cli"
profile = ""
event_as = "bot"
api_as = "user"
event_filter = "im\\.message|vc\\.|calendar\\."
event_types = ""
no_proxy = true
path_prefixes = [
  "/path/to/.local/share/mise/installs/node/22.22.2/bin",
  "/path/to/.local/bin",
]

[lark.env]
LARKSUITE_CLI_CONFIG_DIR = "/path/to/.config/lark-cli"
LARKSUITE_CLI_NO_UPDATE_NOTIFIER = "1"

[pipeline]
transcript_first = true
local_asr_fallback = true
resolve_retries = ["1m", "5m", "15m", "30m"]
minimum_transcript_chars = 80
auto_kb_write = false

[asr]
# Command runs only when Feishu has media but no transcript.
# The command should write a Markdown transcript under {job_dir}; the worker will
# pick the newest *.md by default.
enabled = false
command = """
env \
  LARK_ASR_PYTHON=/path/to/models/.venv/bin/python \
  LARK_ASR_WHISPER_MODEL=/path/to/models/models/AI-ModelScope/whisper-large-v3-ct2-float16 \
  LARK_ASR_USE_WHISPER=1 \
  LARK_ASR_DEVICE=cuda \
  LARK_ASR_FUNASR_DEVICE=cuda:0 \
  /path/to/projects/lark-asr/scripts/asr_fallback.sh \
  --input {media_path} \
  --output-dir {job_dir}/local_asr \
  --minute-token {minute_token}
"""
output_glob = "local_asr/**/*.md"

[codex]
enabled = false
cmd = "/path/to/.local/share/mise/shims/codex"
model = ""
reasoning_effort = "high"
extra_args = ""
prompt_template = """
你在 knowledgebase 仓库中工作。
请先读取仓库约定、AGENTS.md 和相关项目上下文。

会议转写稿路径:
{transcript_path}

会议元数据:
- minute_token: {minute_token}
- meeting_id: {meeting_id}
- calendar_event_id: {calendar_event_id}
- project_hint: {project_hint}

请根据仓库内已有约定处理这份转写稿。
不要在本提示里假设具体放置方法或处理细则；以知识库仓库内容为准。
"""

[[project]]
id = "demo-project"
path = "projects/active/Demo Demo AliasAIDemo Project"
aliases = ["Demo Project", "Demo Alias", "Demo Alias", "Demo Alias", "Demo Contact", "Demo Alias", "Demo OS"]
