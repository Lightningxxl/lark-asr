# Host-run fallback config for FF1 systemd services. Prefer config/docker.example.toml
# for the managed Docker deployment.

[paths]
state_dir = "./data"
work_dir = "./work"
knowledgebase_dir = "/home/xavierx/projects/xfx_knowledge_base"

[lark]
cli = "/home/xavierx/.local/share/mise/installs/node/22.22.2/bin/lark-cli"
profile = ""
event_enabled = false
event_as = "bot"
api_as = "user"
event_filter = "im\\.message|vc\\.|calendar\\."
event_types = ""
minutes_backfill_enabled = true
minutes_backfill_interval_seconds = 900
minutes_backfill_window_minutes = 720
minutes_backfill_page_size = 20
minutes_backfill_query = ""
no_proxy = true
path_prefixes = [
  "/home/xavierx/.local/share/mise/installs/node/22.22.2/bin",
  "/home/xavierx/.local/bin",
]

[lark.env]
LARKSUITE_CLI_CONFIG_DIR = "/home/xavierx/.config/lark-cli-token-only"
LARKSUITE_CLI_NO_UPDATE_NOTIFIER = "1"

[pipeline]
transcript_first = true
local_asr_fallback = true
resolve_retries = ["1m", "5m", "15m", "30m"]
minimum_transcript_chars = 80
minimum_media_duration_seconds = 5.0
auto_kb_write = false

[asr]
enabled = true
command = """
env \
  LARK_ASR_PYTHON=/home/xavierx/codex-transcript-20260512/.venv/bin/python \
  LARK_ASR_WHISPER_MODEL=/home/xavierx/codex-transcript-20260512/models/AI-ModelScope/whisper-large-v3-ct2-float16 \
  LARK_ASR_USE_WHISPER=1 \
  LARK_ASR_DEVICE=cuda \
  LARK_ASR_FUNASR_DEVICE=cuda:0 \
  /home/xavierx/projects/lark-asr/scripts/asr_fallback.sh \
  --input {media_path} \
  --output-dir {job_dir}/local_asr \
  --minute-token {minute_token} \
  --terminology-file {knowledgebase_dir}/company/ASR热词库.md
"""
output_glob = "local_asr/**/*.md"

[codex]
enabled = true
cmd = "/home/xavierx/.local/share/mise/shims/codex"
model = "gpt-5.6-sol"
reasoning_effort = "medium"
extra_args = ""
prompt_template = """
你是 xfx_knowledge_base 的会议归档维护员。
请先读取仓库约定、AGENTS.md 和相关项目上下文，将它们用于判断归类、格式、命名、热词和事实依据。

会议转写稿路径:
{transcript_path}

任务工作目录:
{job_dir}

会议元数据:
- minute_token: {minute_token}
- meeting_id: {meeting_id}
- calendar_event_id: {calendar_event_id}
- project_hint: {project_hint}

本地 ASR 转写稿不一定包含会议日期；如工作目录中存在 feishu_notes/ 或其他会议元数据，会议日期必须以其中的真实开始时间为准，不要用当前运行日期替代，也不要根据内容推定为其他日期。

按以下顺序处理：
1. 按仓库规则创建一份完整的会议转写归档，保留全文、说话人和时间戳，并完成基于知识库上下文的热词修复。
2. 按仓库规则维护 company/ASR热词库.md。
3. 会议构成真实业务事件且有可追溯影响时，在对应主体的过程记录.md 中追加一条精简记录并链接会议归档。
4. 会议已经形成后续应遵守的明确决定时，更新对应项目的决策记录.md；讨论、设想和备选方案保留在会议归档中。
5. 会议已经改变当前判断、风险、阻塞或下一步时，更新对应项目的当前状态.md，并保持轻量看板结构。

本次运行的可编辑文件集合：
- 一份位于 records/asr-recordings/ 的会议归档；
- company/ASR热词库.md；
- 对应主体的过程记录.md；
- 对应项目的决策记录.md；
- 对应项目的当前状态.md。

其他知识库文件作为只读上下文。硬性安全约束：最终 git diff 只能包含上述可编辑文件集合。会议涉及 deck、大纲、方案、报价、合同或其他交付物时，将相关内容保留在会议归档中，不派生这些文件的修改或待办。

完成后请在知识库仓库内自检变更，并创建 git commit。
外层 lark-asr 服务会在 Codex 结束后执行最终 rebase 和 git push 校验；如你未能提交，请保留修改并在输出中说明原因。
"""

[[project]]
id = "smart-store"
path = "projects/active/汽车膜车衣AI智慧门店"
aliases = ["智慧门店", "龙膜", "贴膜", "车衣", "国总", "崧高维岳", "门店经营 OS"]
