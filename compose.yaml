services:
  hook:
    build: .
    restart: unless-stopped
    command: ["hook", "--config", "/config/config.toml"]
    environment:
      HOME: /path/to
      LARK_CLI_NO_PROXY: "1"
    volumes:
      - ./config.toml:/config/config.toml:ro
      - ./data:/app/data
      - ./work:/app/work
      # Mount host credentials/binaries when using host-installed lark-cli/codex.
      - /path/to/.config:/path/to/.config
      - /path/to/.codex:/path/to/.codex
      - /path/to/.local:/path/to/.local:ro
      - /path/to/lark-cli-wrapper.py:/path/to/lark-cli-wrapper.py:ro

  worker:
    build: .
    restart: unless-stopped
    command: ["worker", "--config", "/config/config.toml", "--interval", "20"]
    environment:
      HOME: /path/to
      LARK_CLI_NO_PROXY: "1"
    gpus: all
    volumes:
      - ./config.toml:/config/config.toml:ro
      - ./data:/app/data
      - ./work:/app/work
      - /path/to/projects/knowledgebase:/path/to/projects/knowledgebase
      - /path/to/models:/path/to/models
      - /path/to/.config:/path/to/.config
      - /path/to/.codex:/path/to/.codex
      - /path/to/.local:/path/to/.local:ro
      - /path/to/lark-cli-wrapper.py:/path/to/lark-cli-wrapper.py:ro
